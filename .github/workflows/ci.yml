name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [18, 20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      # The suite injects fetch and sleep, so it never touches the network
      # and never spends Globalping quota.
      - run: npm test
      - name: CLI smoke test
        run: |
          node src/cli.js --help
          # No target means usage error, exit code 2. The `|| code=$?` matters:
          # this step runs under `bash -e`, so a bare failing command would kill
          # the shell before the assertion ever ran, and the step would fail on
          # the very behaviour it is trying to prove.
          code=0
          node src/cli.js 2>/dev/null || code=$?
          test "$code" -eq 2
